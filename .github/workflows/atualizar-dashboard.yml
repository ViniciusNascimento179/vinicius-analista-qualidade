name: Atualizar dashboard
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "dashboard/**"
      - "requirements.txt"
      - ".github/workflows/atualizar-dashboard.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Node para validar análises
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Processar planilha
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/processa_dados.py
      - name: Validar análises críticas e categorias FMS
        run: node scripts/test_analises.cjs
      - name: Commit dos dados gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.js
          new=$(git diff --cached --quiet && echo "sem" || echo "com")
          if [ "$new" = "com" ]; then
            git commit -m "chore: atualiza dados do dashboard [skip ci]"
            git push
          fi
      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
