name: Atualizar dashboard
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "dashboard/**"
      - "requirements.txt"
      - ".github/workflows/atualizar-dashboard.yml"
  workflow_dispatch:
    inputs:
      reprocessar_planilha:
        description: "Reprocessar a planilha armazenada no repositório (pode ser antiga)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identificar mudança na fonte do repositório
        id: fonte
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          REPROCESSAR: ${{ inputs.reprocessar_planilha }}
        run: |
          processar=false
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            if [ "$REPROCESSAR" = "true" ]; then processar=true; fi
          elif [ "$EVENTO" = "push" ]; then
            if [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
              processar=true
            else
              mudancas=$(git diff --name-only "$ANTES" "$GITHUB_SHA" -- data/)
              if [ -n "$mudancas" ]; then processar=true; fi
            fi
          fi
          echo "processar=$processar" >> "$GITHUB_OUTPUT"
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Node para validar análises
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar processamento
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Processar planilha do repositório quando alterada
        if: steps.fonte.outputs.processar == 'true'
        run: python scripts/processa_dados.py
      - name: Validar análises críticas e categorias FMS
        run: |
          node scripts/test_analises.cjs
          node scripts/test_sip_cme.cjs
          node scripts/test_analise_editor.cjs
          node scripts/test_ouvidoria.cjs
          node scripts/test_jci.cjs
      - name: Validar cálculos e relatório PDSA
        run: node scripts/test_pdsa.cjs
      - name: Commit dos dados gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.js
          new=$(git diff --cached --quiet && echo "sem" || echo "com")
          if [ "$new" = "com" ]; then
            git commit -m "chore: atualiza dados do dashboard [skip ci]"
            git push
          fi
      - name: Versionar arquivos para atualização do navegador
        run: python scripts/versiona_assets.py
      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

